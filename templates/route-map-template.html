<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅行路线图</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { height: 60vh; width: 100%; }
        .header { background: #2c3e50; color: white; padding: 15px; text-align: center; }
        .legend { padding: 10px; background: #f8f9fa; border-bottom: 1px solid #ddd; }
        .tabs { display: flex; background: #ecf0f1; overflow-x: auto; }
        .tab { padding: 10px 15px; cursor: pointer; border: none; background: none; white-space: nowrap; }
        .tab.active { background: #3498db; color: white; }
        .day-content { padding: 15px; display: none; }
        .day-content.active { display: block; }
        .timeline { border-left: 3px solid #3498db; padding-left: 20px; margin-left: 10px; }
        .timeline-item { margin-bottom: 15px; }
        .timeline-time { font-weight: bold; color: #2c3e50; }
        .timeline-content { margin-top: 5px; }
        .footer { background: #2c3e50; color: white; padding: 10px; text-align: center; font-size: 12px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>旅行路线图</h1>
        <p>点击地图上的标记查看详情</p>
    </div>
    
    <div id="map"></div>
    
    <div class="legend">
        <strong>路线说明</strong><br>
        <span style="color: #FF6B6B;">●</span> Day1<br>
        <span style="color: #4ECDC4;">●</span> Day2<br>
        <span style="color: #45B7D1;">●</span> Day3
    </div>
    
    <div class="tabs" id="tabs">
        <button class="tab active" onclick="showDay('day1')">Day 1</button>
        <button class="tab" onclick="showDay('day2')">Day 2</button>
        <button class="tab" onclick="showDay('day3')">Day 3</button>
    </div>
    
    <div id="day1" class="day-content active">
        <h2>Day 1：乌鲁木齐 → 赛里木湖</h2>
        <div class="timeline">
            <div class="timeline-item">
                <div class="timeline-time">10:00 - 12:30</div>
                <div class="timeline-content">📍 乌鲁木齐出发前往赛里木湖</div>
            </div>
            <div class="timeline-item">
                <div class="timeline-time">12:30 - 13:30</div>
                <div class="timeline-content">📍 精河县午餐</div>
            </div>
            <div class="timeline-item">
                <div class="timeline-time">14:00 - 18:00</div>
                <div class="timeline-content">📍 赛里木湖环湖</div>
            </div>
        </div>
    </div>
    
    <div id="day2" class="day-content">
        <h2>Day 2：赛里木湖 → 霍尔果斯</h2>
        <div class="timeline">
            <div class="timeline-item">
                <div class="timeline-time">09:00 - 12:00</div>
                <div class="timeline-content">📍 赛里木湖日出</div>
            </div>
            <div class="timeline-item">
                <div class="timeline-time">12:30 - 16:00</div>
                <div class="timeline-content">📍 果子沟大桥</div>
            </div>
        </div>
    </div>
    
    <div class="footer">
        由 travel-itinerary skill 生成 | 高德地图
    </div>
    
    <script>
        // 初始化地图
        var map = L.map('map').setView([44.5, 82.0], 8);
        
        // 添加高德地图图层
        var amapKey = 'YOUR_AMAP_KEY'; // 替换为实际的高德地图API key
        L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}&key=' + amapKey, {
            subdomains: '1234',
            attribution: '© 高德地图',
            maxZoom: 18
        }).addTo(map);
        
        // 添加标记
        var markers = [
            {name: '乌鲁木齐', coord: [43.82, 87.62], type: 'start'},
            {name: '赛里木湖', coord: [44.60, 81.17], type: 'day1'},
            {name: '霍尔果斯', coord: [44.12, 80.42], type: 'day2'}
        ];
        
        markers.forEach(function(marker) {
            L.marker(marker.coord)
                .addTo(map)
                .bindPopup('<b>' + marker.name + '</b>');
        });
        
        // 切换Day的函数
        function showDay(dayId) {
            document.querySelectorAll('.day-content').forEach(function(el) {
                el.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(function(el) {
                el.classList.remove('active');
            });
            document.getElementById(dayId).classList.add('active');
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
